name: Android Release

on:
  push:
    tags: [android-v*]
  workflow_dispatch:
    inputs:
      version:
        description: "Android version (for example, 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#android-v}"
          fi

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE < 1 )); then
            echo "Version code must be positive" >&2
            exit 1
          fi

          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Import Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is required" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sorcerer-remote.jks"

      - name: Build and test signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sorcerer-remote.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon clean lint testDebugUnitTest assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify and name release artifact
        id: artifact
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "Signed release APK was not produced" >&2
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 5

          NAME="Sorcerer-Remote-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sorcerer-remote-${{ steps.version.outputs.name }}
          path: |
            android-client/${{ steps.artifact.outputs.apk }}
            android-client/${{ steps.artifact.outputs.checksum }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android-client/${{ steps.artifact.outputs.apk }}
            android-client/${{ steps.artifact.outputs.checksum }}
