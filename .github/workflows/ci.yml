name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Verify types and production build
        run: npm run verify

      - name: Run tests
        run: npx vitest run
