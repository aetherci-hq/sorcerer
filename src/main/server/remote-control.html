<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sorcerer — Remote Control</title>
<style>
  :root {
    --bg: #0f0e0c;
    --bg-card: #1a1714;
    --bg-card-hover: #231f19;
    --bg-elevated: #282420;
    --bg-terminal: #0b0a08;
    --border: #2a261e;
    --border-medium: #3a342a;
    --text: #ede6d8;
    --text-secondary: #a69e8e;
    --text-tertiary: #6b6355;
    --text-muted: #4a4540;
    --accent: #e2a445;
    --accent-dim: #c48a2a;
    --green: #5ec269;
    --red: #e25555;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* ── Header ─────────────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-logo {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
    margin-left: 6px;
  }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .conn-dot.connected { background: var(--green); }
  .conn-dot.disconnected { background: var(--red); }

  /* ── Session list ───────────────────────────── */
  .session-list {
    padding: 8px 12px 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Session card ───────────────────────────── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .card.expanded {
    border-color: var(--border-medium);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px;
    min-height: 52px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .card-header:active {
    background: var(--bg-card-hover);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-muted);
  }
  .status-dot.active {
    background: var(--green);
    box-shadow: 0 0 6px rgba(94, 194, 105, 0.4);
  }
  .status-dot.idle {
    background: var(--text-tertiary);
  }

  .card-info {
    flex: 1;
    min-width: 0;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .card-name-project {
    color: var(--text-tertiary);
    font-weight: 400;
  }

  .card-name-sep {
    color: var(--text-muted);
    margin: 0 5px;
    font-weight: 400;
  }

  .card-name-session {
    color: var(--text);
    font-weight: 600;
  }

  .card-name-branch {
    color: var(--text-tertiary);
    font-weight: 400;
    font-size: 12px;
  }

  .card-type-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-elevated);
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .card-chevron {
    width: 16px;
    height: 16px;
    color: var(--text-muted);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .card.expanded .card-chevron {
    transform: rotate(90deg);
  }

  /* ── Expanded body ──────────────────────────── */
  .card-body {
    display: none;
    border-top: 1px solid var(--border);
  }
  .card.expanded .card-body {
    display: block;
  }

  .terminal-preview {
    background: var(--bg-terminal);
    padding: 10px 12px;
    max-height: 200px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    -webkit-overflow-scrolling: touch;
  }

  .terminal-preview:empty::after {
    content: 'No terminal output yet';
    color: var(--text-muted);
    font-style: italic;
  }

  .nudge-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }

  .nudge-input {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border-medium);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    min-height: 44px;
  }
  .nudge-input::placeholder {
    color: var(--text-muted);
  }
  .nudge-input:focus {
    border-color: var(--accent);
  }

  .nudge-send {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .nudge-send:active {
    background: var(--accent-dim);
  }
  .nudge-send:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* ── Session detail (fullscreen replacement) ── */
  .idle-fullscreen {
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  .idle-fullscreen-back {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 14px;
    font-family: var(--font);
    cursor: pointer;
    min-height: 48px;
    -webkit-user-select: none;
    user-select: none;
  }
  .idle-fullscreen-back:active {
    background: var(--bg-card-hover);
  }

  .idle-fullscreen-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 24px;
  }

  .idle-fullscreen-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    max-width: 100%;
    word-break: break-word;
  }

  .idle-fullscreen-status {
    font-size: 14px;
    color: var(--text-tertiary);
  }

  .idle-fullscreen-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    width: 100%;
    max-width: 320px;
  }

  .idle-btn {
    flex: 1;
    min-height: 52px;
    border-radius: 10px;
    border: 1px solid var(--border-medium);
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .idle-btn:active {
    background: var(--bg-card-hover);
  }
  .idle-btn--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .idle-btn--primary:active {
    background: var(--accent-dim);
  }
  .idle-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* ── Toast ──────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elevated);
    border: 1px solid var(--border-medium);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.visible { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="header-logo">S</div>
    <span class="header-title">Sorcerer<span class="header-subtitle">Remote Control</span></span>
  </div>
  <div class="conn-dot" id="connDot"></div>
</div>

<div class="session-list" id="sessionList">
  <div class="empty-state">Connecting...</div>
</div>

<div id="idleOverlay" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ── Config ──────────────────────────────────
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('token');
  if (!TOKEN) {
    document.getElementById('sessionList').innerHTML =
      '<div class="empty-state">Append <code>?token=YOUR_TOKEN</code> to the URL to connect.</div>';
    return;
  }

  const BASE = location.origin;
  const WS_URL = `ws${location.protocol === 'https:' ? 's' : ''}://${location.host}/ws?token=${TOKEN}`;

  // ── State ───────────────────────────────────
  let sessions = [];
  let agents = [];
  let projects = [];
  let expandedId = null;
  let idleOverlayItem = null;  // item being shown in fullscreen idle view
  let scrollbackCache = {};
  let ws = null;
  let connected = false;

  // ── RPC helper ──────────────────────────────
  async function rpc(method, ...args) {
    const res = await fetch(`${BASE}/api/rpc`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`
      },
      body: JSON.stringify({ method, args })
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json.result;
  }

  // ── Theme ───────────────────────────────────
  const THEMES = {
    default: {
      'bg-root':'#0f0e0c','bg-titlebar':'#1a1714','bg-hover':'#231f19','bg-elevated':'#282420',
      'terminal-bg':'#0f0e0c','border-subtle':'#2a261e','border-medium':'#3a342a',
      'text-primary':'#ede6d8','text-secondary':'#a69e8e','text-tertiary':'#6b6355','text-muted':'#4a4540',
      'accent':'#e2a445','accent-dim':'#c48a2a','green':'#5ec269','danger':'#e25555'
    },
    aetherci: {
      'bg-root':'#060606','bg-titlebar':'#0a0a0a','bg-hover':'#1a1a1a','bg-elevated':'#121212',
      'terminal-bg':'#060606','border-subtle':'rgba(255,255,255,0.10)','border-medium':'rgba(255,255,255,0.15)',
      'text-primary':'#ffffff','text-secondary':'#9ca3af','text-tertiary':'#6b7280','text-muted':'#4b5563',
      'accent':'#00ff88','accent-dim':'#00cc6a','green':'#00ff88','danger':'#db504a'
    }
  };

  async function loadTheme() {
    try {
      const themeId = await rpc('settings:get', 'theme');
      const colors = THEMES[themeId] || THEMES.default;
      const root = document.documentElement;
      root.style.setProperty('--bg', colors['bg-root']);
      root.style.setProperty('--bg-card', colors['bg-titlebar']);
      root.style.setProperty('--bg-card-hover', colors['bg-hover']);
      root.style.setProperty('--bg-elevated', colors['bg-elevated']);
      root.style.setProperty('--bg-terminal', colors['terminal-bg']);
      root.style.setProperty('--border', colors['border-subtle']);
      root.style.setProperty('--border-medium', colors['border-medium']);
      root.style.setProperty('--text', colors['text-primary']);
      root.style.setProperty('--text-secondary', colors['text-secondary']);
      root.style.setProperty('--text-tertiary', colors['text-tertiary']);
      root.style.setProperty('--text-muted', colors['text-muted']);
      root.style.setProperty('--accent', colors['accent']);
      root.style.setProperty('--accent-dim', colors['accent-dim']);
      root.style.setProperty('--green', colors['green']);
      root.style.setProperty('--red', colors['danger']);
    } catch { /* use defaults */ }
  }

  // ── Toast ───────────────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), 2000);
  }

  // ── WebSocket ───────────────────────────────
  function connectWS() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      connected = true;
      updateConnDot();
      subscribeExitAll();
      // Re-subscribe to expanded session if any
      if (expandedId) subscribeToSession(expandedId);
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.channel && msg.channel.startsWith('terminal:data:')) {
          const sid = msg.channel.slice('terminal:data:'.length);
          appendScrollback(sid, msg.data);
          if (expandedId === sid) {
            updateTerminalPreview(sid);
          }
        }
        if (msg.channel && msg.channel.startsWith('terminal:exit:')) {
          setTimeout(loadState, 500);
        }
      } catch {}
    };

    ws.onclose = () => {
      connected = false;
      updateConnDot();
      setTimeout(connectWS, 3000);
    };

    ws.onerror = () => { ws.close(); };
  }

  function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  }

  let subscribedId = null;  // only one session subscribed at a time

  function subscribeToSession(id) {
    if (subscribedId === id) return;
    // Unsubscribe from previous
    if (subscribedId) {
      wsSend({ action: 'unsubscribe', channel: `terminal:data:${subscribedId}` });
      wsSend({ action: 'unsubscribe', channel: `terminal:exit:${subscribedId}` });
    }
    // Subscribe to new
    if (id) {
      wsSend({ action: 'subscribe', channel: `terminal:data:${id}` });
      wsSend({ action: 'subscribe', channel: `terminal:exit:${id}` });
    }
    subscribedId = id;
  }

  // Subscribe to exit events for all sessions (lightweight, just for status refresh)
  function subscribeExitAll() {
    const all = [...sessions, ...agents];
    for (const item of all) {
      wsSend({ action: 'subscribe', channel: `terminal:exit:${item.id}` });
    }
  }

  // ── Scrollback ──────────────────────────────
  const MAX_SCROLLBACK = 4000;

  function appendScrollback(sid, data) {
    const prev = scrollbackCache[sid] || '';
    const combined = prev + data;
    scrollbackCache[sid] = combined.length > MAX_SCROLLBACK
      ? combined.slice(-MAX_SCROLLBACK)
      : combined;
  }

  function getPreviewLines(sid, lineCount) {
    const raw = scrollbackCache[sid] || '';
    const clean = raw.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '').replace(/\x1b\][^\x07]*\x07/g, '');
    const lines = clean.split('\n').filter(l => l.trim());
    return lines.slice(-lineCount).join('\n');
  }

  // ── Connection indicator ────────────────────
  function updateConnDot() {
    const dot = document.getElementById('connDot');
    dot.className = 'conn-dot ' + (connected ? 'connected' : 'disconnected');
  }

  // ── Load data ───────────────────────────────
  async function loadState() {
    try {
      const [s, a, p] = await Promise.all([
        rpc('session:list'),
        rpc('agent:list'),
        rpc('project:list')
      ]);
      sessions = (s || []).filter(x => x.status !== 'archived' && x.status !== 'deleted' && x.type !== 'quick-terminal');
      agents = a || [];
      projects = p || [];
      render();
      if (connected) subscribeExitAll();
    } catch (err) {
      document.getElementById('sessionList').innerHTML =
        `<div class="empty-state">Failed to load: ${err.message}</div>`;
    }
  }

  // ── Data helpers ────────────────────────────
  function getAllItems() {
    return [
      ...sessions.map(s => ({ ...s, _type: 'session', _project: projects.find(p => p.id === s.project_id) })),
      ...agents.map(a => ({ ...a, _type: 'agent', _project: null }))
    ];
  }

  // ── Render helpers ─────────────────────────
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildCardTitle(item) {
    if (item._type === 'agent') {
      return `<span class="card-name-session">${esc(item.name)}</span>`;
    }
    const parts = [];
    if (item._project) {
      parts.push(`<span class="card-name-project">${esc(item._project.name)}</span>`);
      parts.push(`<span class="card-name-sep">/</span>`);
    }
    parts.push(`<span class="card-name-session">${esc(item.name)}</span>`);
    if (item.branch) {
      parts.push(`<span class="card-name-sep">/</span>`);
      parts.push(`<span class="card-name-branch">${esc(item.branch)}</span>`);
    }
    return parts.join('');
  }

  function buildDisplayName(item) {
    if (item._type === 'agent') return item.name;
    const parts = [];
    if (item._project) parts.push(item._project.name);
    parts.push(item.name);
    return parts.join(' / ');
  }

  // ── Render ──────────────────────────────────
  function render() {
    const list = document.getElementById('sessionList');
    const all = getAllItems();

    all.sort((a, b) => {
      const order = { active: 0, idle: 1 };
      const oa = order[a.status] ?? 2;
      const ob = order[b.status] ?? 2;
      if (oa !== ob) return oa - ob;
      return (a.name || '').localeCompare(b.name || '');
    });

    if (all.length === 0) {
      list.innerHTML = '<div class="empty-state">No sessions or agents running.<br>Create one in Sorcerer to see it here.</div>';
      return;
    }

    list.innerHTML = all.map(item => {
      const isExpanded = expandedId === item.id;
      const isActive = item.status === 'active';

      return `
        <div class="card ${isExpanded ? 'expanded' : ''}" data-id="${item.id}">
          <div class="card-header" onclick="window._rc.toggle('${item.id}')">
            <div class="status-dot ${item.status}"></div>
            <div class="card-info">
              <div class="card-name">${buildCardTitle(item)}</div>
            </div>
            <div class="card-type-badge">${item._type === 'agent' ? 'Agent' : 'Session'}</div>
            <svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
          <div class="card-body">
            <div class="terminal-preview" id="term-${item.id}">${esc(getPreviewLines(item.id, 10))}</div>
            ${isActive ? `
              <div class="nudge-bar">
                <input class="nudge-input" id="input-${item.id}" type="text"
                  placeholder="Send a message..." autocomplete="off" autocorrect="off" spellcheck="false"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();window._rc.nudge('${item.id}')}" />
                <button class="nudge-send" onclick="window._rc.nudge('${item.id}')" title="Send">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                  </svg>
                </button>
              </div>
            ` : `
              <div class="nudge-bar" style="justify-content: center;">
                <button class="idle-btn idle-btn--primary" style="max-width: 200px;" onclick="window._rc.showIdle('${item.id}')">
                  Manage Session
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  function updateTerminalPreview(sid) {
    const el = document.getElementById('term-' + sid);
    if (el) {
      el.textContent = getPreviewLines(sid, 10);
      el.scrollTop = el.scrollHeight;
    }
  }

  // ── Session detail view (replaces main list) ─
  function renderIdleOverlay() {
    const header = document.querySelector('.header');
    const list = document.getElementById('sessionList');
    const overlay = document.getElementById('idleOverlay');

    if (!idleOverlayItem) {
      // Show main view
      header.style.display = '';
      list.style.display = '';
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      return;
    }

    // Hide main view, show session detail
    header.style.display = 'none';
    list.style.display = 'none';
    overlay.style.display = '';

    const item = idleOverlayItem;
    const name = buildDisplayName(item);
    overlay.innerHTML = `
      <div class="idle-fullscreen">
        <div class="idle-fullscreen-back" onclick="window._rc.closeIdle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back
        </div>
        <div class="idle-fullscreen-body">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); opacity: 0.5;">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
          <div class="idle-fullscreen-name">${esc(name)}</div>
          <div class="idle-fullscreen-status">Session has ended</div>
          <div class="idle-fullscreen-actions">
            <button class="idle-btn idle-btn--primary" onclick="window._rc.resume('${item.id}', '${item._type}')">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M6 3.5a.5.5 0 0 1 .795-.404l6 4.5a.5.5 0 0 1 0 .808l-6 4.5A.5.5 0 0 1 6 12.5v-9z"/>
              </svg>
              Resume
            </button>
            <button class="idle-btn" onclick="window._rc.restart('${item.id}', '${item._type}')">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
                <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
              </svg>
              New Session
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // ── Actions ─────────────────────────────────
  window._rc = {
    toggle(id) {
      // Find the item
      const item = getAllItems().find(x => x.id === id);

      // If idle, go directly to fullscreen overlay
      if (item && item.status !== 'active') {
        idleOverlayItem = item;
        renderIdleOverlay();
        return;
      }

      // Toggle expand for active sessions
      if (expandedId === id) {
        expandedId = null;
        subscribeToSession(null);
      } else {
        expandedId = id;
        subscribeToSession(id);
      }
      render();
      if (expandedId) {
        setTimeout(() => {
          const card = document.querySelector(`.card[data-id="${id}"]`);
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
      }
    },

    showIdle(id) {
      idleOverlayItem = getAllItems().find(x => x.id === id) || null;
      renderIdleOverlay();
    },

    closeIdle() {
      idleOverlayItem = null;
      renderIdleOverlay();
    },

    nudge(id) {
      const input = document.getElementById('input-' + id);
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      wsSend({ action: 'terminal:write', sessionId: id, data: text + '\n' });
      input.value = '';
      showToast('Sent');
    },

    async resume(id, type) {
      try {
        if (type === 'agent') {
          await rpc('agent:resume', id);
        } else {
          await rpc('session:resume', id);
        }
        showToast('Resuming...');
        idleOverlayItem = null;
        renderIdleOverlay();
        setTimeout(loadState, 1000);
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    },

    async restart(id, type) {
      try {
        if (type === 'agent') {
          await rpc('agent:restart', id);
        } else {
          await rpc('session:restart', id);
        }
        showToast('Starting new session...');
        idleOverlayItem = null;
        renderIdleOverlay();
        setTimeout(loadState, 1000);
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }
  };

  // ── Refresh on visibility ───────────────────
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadState();
  });

  // ── Periodic refresh ────────────────────────
  setInterval(loadState, 15000);

  // ── Boot ────────────────────────────────────
  loadTheme();
  loadState();
  connectWS();
})();
</script>
</body>
</html>
